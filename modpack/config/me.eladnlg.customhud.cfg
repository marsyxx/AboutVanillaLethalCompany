## Settings file was created by plugin EladsHUD+ v1.1.1
## Plugin GUID: me.eladnlg.customhud

[General]

## The size of the HUD.
# Setting type: Single
# Default value: 1
HUDScale = 1

## Should planet info be hidden. If modifying from an in-game menu, this requires you to rejoin the game.
# Setting type: Boolean
# Default value: false
HidePlanetInfo = false

## Outline the stamina / weight numbers and the battery, flashlight and head item % rows like the vanilla control tips on the right of the screen (same game font and outline).
# Setting type: Boolean
# Default value: false
OutlineNumbers = false

## Press a key to show the mouse cursor so you can point at the HUD (hover a buff / injury icon to see what it does). The camera stops turning while the cursor is shown.
# Setting type: Boolean
# Default value: true
EnableCursorKey = true

## Input System path of the key. Examples: <Mouse>/middleButton, <Mouse>/forwardButton, <Keyboard>/leftAlt, <Keyboard>/f2
# Setting type: String
# Default value: <Mouse>/middleButton
CursorKey = <Mouse>/middleButton

## Off: press once to show the cursor, again to hide it. On: the cursor shows only while you hold the key.
# Setting type: Boolean
# Default value: false
HoldToShow = false

[Health and Stamina]

## Should the healthbar be hidden after not taking damage for a while.
# Setting type: Boolean
# Default value: true
HideHealthbarAutomatically = true

## The amount of time before the healthbar starts fading away.
# Setting type: Single
# Default value: 4
HealthbarHideDelay = 4

## What the stamina text should display.
## Disabled - The stamina text will be hidden.
## PercentageOnly - Only the percentage will be displayed. (recommended)
## Full - Both percentage and rate of gain/loss will be displayed.
# Setting type: StaminaTextOptions
# Default value: PercentageOnly
# Acceptable values: Disabled, PercentageOnly, Full
DetailedStamina = PercentageOnly

## The health bar's four corners move with the status icon frames (the same corners). Off: Elad's still corners.
# Setting type: Boolean
# Default value: false
AnimatedHealthFrame = false

## The stamina bar fades to cyan while UsualScrap's Productivity Auto-Injector is active (still turns red when stamina is low).
# Setting type: Boolean
# Default value: true
InjectorStaminaColor = true

## How extra health (e.g. FrailtyMedical's Racing Heart) shows on the health bar.
## SameLength - the bar keeps its length: your health in red, the extra in green right after it; over 100 in total the whole bar is split red : green by health : extra.
## LastPart - the bar keeps its length and the green is always the last part of it (the red can look smaller than your real health).
## Extend - the bar grows past its normal end by the extra (the utility slot next to it moves along).
# Setting type: BarOptions
# Default value: SameLength
# Acceptable values: SameLength, LastPart, Extend
ExtraHealthBar = SameLength

## How the health number shows extra health.
## Total - health + extra (e.g. 130).
## HealthPlusExtra - your health with a small +extra (e.g. 80 +50).
# Setting type: NumberOptions
# Default value: Total
# Acceptable values: Total, HealthPlusExtra
ExtraHealthNumber = Total

[Status icons]

## Show the vanilla warning text (steam leak, Cadaver spores / fever, low oxygen) under the health bar. Vanilla shows it in the HUD that Elad's HUD hides.
# Setting type: Boolean
# Default value: true
ShowWarnings = true

## How many seconds a warning stays after its cause stops (steam leak warnings stay while you are in the steam).
# Setting type: Single
# Default value: 4
# Acceptable value range: From 1 to 15
WarningTime = 4

## If the Frailty mod is installed, show its status effects (broken leg, bleeding, ...) with the time left under the health bar, instead of Frailty's own icons.
# Setting type: Boolean
# Default value: true
ShowFrailtyConditions = true

## The status icon frames move like FrailtyPlus' icon frames (their dashes change a few times a second). Off: still frames.
# Setting type: Boolean
# Default value: true
AnimatedFrames = true

## Show UsualScrap's Productivity Auto-Injector (time left) under the health bar. Other mods (e.g. TZPPlus) add their own icons here through StatusApi and have their own settings.
# Setting type: Boolean
# Default value: true
ShowBuffs = true

## Buff numbers (TZP %, TZP Rush and injector time) in the buff's own colour instead of white.
# Setting type: Boolean
# Default value: false
ColoredBuffNumbers = false

## Status icons per row. While everything fits, it stays one row (buffs first, then injuries / debuffs). With more, buffs get their own row(s) and injuries / debuffs start a new row below.
# Setting type: Int32
# Default value: 7
# Acceptable value range: From 1 to 20
IconsPerRow = 7

## Make the status icons a bit smaller once there are 2 or more rows.
# Setting type: Boolean
# Default value: false
ShrinkWithMoreRows = false

## Move the status area left/right (negative = left).
# Setting type: Single
# Default value: 0
OffsetX = 0

## Move the status area up/down (negative = down).
# Setting type: Single
# Default value: 0
OffsetY = 0

[Battery]

## How the flashlight battery is displayed whilst unequipped.
## Disabled - Flashlight battery will not be displayed.
## Vanilla - Flashlight battery will be displayed when you don't have a battery-using item equipped.
## Separate - Flashlight battery will be displayed using a dedicated panel. (recommended)
# Setting type: PocketFlashlightOptions
# Default value: Separate
# Acceptable values: Disabled, Vanilla, Separate
FlashlightBattery = Separate

## Should the uses/time left for a battery-using item be displayed.
# Setting type: Boolean
# Default value: true
DisplayTimeLeft = true

## Show the battery of the AdvancedCompany head-slot item (Helmet Lamp, Tactical Helmet, Headset, Vision Enhancer). Alone it uses the normal battery row; with a battery item or TZP in your hand it moves to a small row above (next to the flashlight if that is shown too).
# Setting type: Boolean
# Default value: true
ShowHeadwearBattery = true

## Keep showing the head item while it is switched off (light rays only show while it is on). Off = only show it while it is on, like the pocketed flashlight.
# Setting type: Boolean
# Default value: true
ShowWhenSwitchedOff = true

## Give the pocketed-flashlight icon a small gap inside its outline, like the battery and head lamp icons. Needs a rejoin to change.
# Setting type: Boolean
# Default value: true
FlashlightIconGap = true

## Compact battery UI: held item, head item and flashlight all in the main battery row (left to right, in that order), with slightly smaller numbers and (4:30) instead of (4:30 remaining).
# Setting type: Boolean
# Default value: false
CompactBatteryUI = false

[Utility slot]

## Put the utility slot at the right end of the health bar. Off = where it was before (above the HUD).
# Setting type: Boolean
# Default value: true
NextToHealthBar = true

## Hide the [TAB] key text next to the utility slot.
# Setting type: Boolean
# Default value: true
HideKeyText = true

## Move the utility slot left/right (negative = left).
# Setting type: Single
# Default value: 0
OffsetX = 0

## Move the utility slot up/down (negative = down).
# Setting type: Single
# Default value: 0
OffsetY = 0

[Mic]

## Show a mic icon at the right end of the stamina bar while you talk (push to talk: while the talk key is held; voice activation: while the game hears you). Off = no mic icon (the muted icon has its own setting).
# Setting type: Boolean
# Default value: true
ShowMicIcon = true

## Show a red crossed-out mic while your mic is turned off in the game settings.
# Setting type: Boolean
# Default value: true
ShowMutedIcon = true

## How the mic icon is drawn.
## Solid - one solid shape.
## TopGap - the top part has an outline with a gap inside, like the battery icon; thin stand.
## FullGap - the top part and the stand both have an outline with a gap inside.
# Setting type: MicIconStyle
# Default value: Solid
# Acceptable values: Solid, TopGap, FullGap
IconStyle = Solid

## Move the mic icon left/right (negative = left).
# Setting type: Single
# Default value: 0
OffsetX = 0

## Move the mic icon up/down (negative = down).
# Setting type: Single
# Default value: 0
OffsetY = 0

## Size of the mic icon.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0,5 to 2
Size = 1

[Crosshair]

## Show a crosshair in the middle of the screen (the game has none).
# Setting type: Boolean
# Default value: false
Enabled = false

## The frame around the middle.
## Full - 4 corners, each with a little dash on both sides (open on all 4 sides).
## Corners - the corners only.
## None - no frame.
# Setting type: FrameStyles
# Default value: Full
# Acceptable values: Full, Corners, None
FrameStyle = Full

## The mark in the middle.
## OpenPlus - a short + with an empty centre, its arms running over the frame.
## OpenPlusDot - the same with a small dot in the centre.
## Plus - a small closed +.
## Dot - a small dot.
## None - nothing (with FrameStyle None too, nothing is shown).
# Setting type: CrosshairStyles
# Default value: OpenPlus
# Acceptable values: OpenPlus, OpenPlusDot, Plus, Dot, None
CrosshairStyle = OpenPlus

## Frame width in pixels at 1080p (scales with the screen).
# Setting type: Int32
# Default value: 28
# Acceptable value range: From 16 to 64
Size = 28

## Line width in pixels at 1080p.
# Setting type: Int32
# Default value: 2
# Acceptable value range: From 1 to 6
Thickness = 2

## How solid it is (low = blends in).
# Setting type: Single
# Default value: 0.55
# Acceptable value range: From 0 to 1
Opacity = 0.55

## A thin dark outline (it fades with the opacity).
# Setting type: Boolean
# Default value: true
Outline = true

## When it shows.
## Always - always.
## HoldingItem - while you hold something.
## HoldingWeapon - while you hold a weapon (shovel, stop sign, knife, shotgun...).
# Setting type: ShowWhenOptions
# Default value: Always
# Acceptable values: Always, HoldingItem, HoldingWeapon
ShowWhen = Always

## Hide it while the game's hand icon / hover text shows, so the two never overlap.
# Setting type: Boolean
# Default value: true
HideOnInteract = true

