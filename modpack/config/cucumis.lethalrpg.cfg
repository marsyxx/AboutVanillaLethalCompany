[6. Run journal (when you host)]

## When this PC hosts: writes what happens in each day (moon, weather, deaths and their causes, XP by source, scrap, kills, quota payouts, every purchase and respec) as JSON lines to BepInEx/LethalRPG/journal-<save>.jsonl, to help balance LethalRPG. Players appear only as P1, P2, ... (their slot), never by name or Steam ID. Nothing is sent anywhere; share the files only if you want to. At 1 MB the file moves to .1 (3 old files are kept). Players who join are told that you record. Takes effect at once.
# Setting type: Boolean
# Default value: false
RecordRunJournal = false

