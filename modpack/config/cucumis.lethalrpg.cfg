[0. General (host decides)]

## Sets the main rules of the ship at once. Custom: the settings in this section as they are. Classic: personal upgrades from 50% of each quota's surplus, split by the scrap each player brought (the defaults). Solo: personal upgrades paid straight from the group credits. CrewOwnUpgrades: personal upgrades, and every player gets the whole 50% share. CrewCredits: personal upgrades paid from the group credits, every player pays their part of the price (PriceShareCap stays yours). Team: upgrades shared by the crew, paid from a team budget that gets 50% of each quota's surplus. LguCompanion: Classic, and LethalRPG leaves the upgrades LateGameUpgrades also has to it (OverlapPolicy PreferOtherMod). Any preset but Custom decides Currency, SurplusSharePercent, TakeShareFromGroupCredits, ShareSplit, SplitUpgradePrices and UpgradeOwnership (LguCompanion also OverlapPolicy); their own values stay saved for Custom. A switch to team upgrades waits until the ship is in orbit, a switch back to personal upgrades until the ship next lands.
# Setting type: RulesPreset
# Default value: Custom
# Acceptable values: Custom, Classic, Solo, CrewOwnUpgrades, CrewCredits, Team, LguCompanion
RulesPreset = Team

## How upgrades are paid for.
## SurplusShare: when a quota is completed, a share of the surplus (money above the quota) goes into the players' personal upgrade budgets.
## GroupCredits: upgrades are bought directly with the group credits, the same money used in the shop (with personal upgrades, SplitUpgradePrices decides whether every player pays the full price or only their part). RulesPreset decides this unless it is Custom.
# Setting type: CurrencyMode
# Default value: SurplusShare
# Acceptable values: SurplusShare, GroupCredits
Currency = SurplusShare

## SurplusShare only: percentage of the quota surplus that becomes upgrade budget. ShareSplit decides whether the players split it or each of them gets all of it (FullShareEach); in team mode it goes into the team budget. RulesPreset decides this unless it is Custom.
# Setting type: Int32
# Default value: 50
# Acceptable value range: From 0 to 100
SurplusSharePercent = 50

## SurplusShare only: if enabled, the share is taken out of the group credits (it is the same money you would spend in the shop), only once per quota even with ShareSplit = FullShareEach. If disabled, the budget is an extra bonus on top. RulesPreset decides this unless it is Custom.
# Setting type: Boolean
# Default value: true
TakeShareFromGroupCredits = true

## SurplusShare with personal upgrades only: who gets the quota share. Even: the share is split evenly between the players. ByContribution: the share is split by the scrap value each player brought to the ship during the quota (evenly if nobody brought anything). FullShareEach: every player gets the whole share for their own upgrades (e.g. $187 each instead of $187 split between three), but the group credits pay it only once (if TakeShareFromGroupCredits is on). Everyone then progresses as fast as in team mode, where one upgrade counts for every player, but picks their own upgrades (with UniqueSkillCurrency = Money also their own skills). Best chosen for a whole run: once a full share was paid, a later switch to team mode treats every personal budget as a full share. In team mode the share always goes into the team budget. RulesPreset decides this unless it is Custom.
# Setting type: ShareSplit
# Default value: ByContribution
# Acceptable values: Even, ByContribution, FullShareEach
ShareSplit = ByContribution

## GroupCredits with personal upgrades only: every player pays only their part of a body or tool upgrade, the price divided by the players in the lobby who have LethalRPG (at most PriceShareCap of them), rounded up (e.g. $25 each instead of $75 with three players). When everyone buys a level, a crew of up to PriceShareCap players pays one price, as in team mode where one upgrade counts for every player, but everyone picks their own upgrades. Off: every player pays the full price. Prices follow the lobby (lower when someone joins, higher when someone leaves); a respec gives back RefundPercent of what was actually paid. Skills paid with money always cost the full price (they are personal in team mode too). Best chosen for a whole run: a switch to team mode keeps the highest level anyone had, also levels bought for a part of the price. RulesPreset decides this unless it is Custom.
# Setting type: Boolean
# Default value: false
SplitUpgradePrices = false

## SplitUpgradePrices only: the price is divided by at most this many players (1: everyone pays the full price).
# Setting type: Int32
# Default value: 4
# Acceptable value range: From 1 to 64
PriceShareCap = 4

## Xp: unique and ultimate skills cost XP (sources in '0. XP sources'). Money: they cost money like normal upgrades; then skills are learned and reset (respec) in orbit only.
# Setting type: UniqueSkillCurrency
# Default value: Xp
# Acceptable values: Xp, Money
UniqueSkillCurrency = Xp

## Skill tree: unique skills need a level in a related upgrade first (e.g. Packmule needs Strength 3).
# Setting type: Boolean
# Default value: true
RequirePrerequisites = true

## 'rpg refund' resets your upgrades and gives back this percentage of the money and XP you spent.
# Setting type: Int32
# Default value: 50
# Acceptable value range: From 0 to 100
RefundPercent = 50

## If enabled, money upgrades and budgets are wiped when the crew gets fired (game over), so they only last one run; with ProgressScope = Save also the XP and the skills that belong to the save. If disabled, all of this survives a game over and stays in the save file. With ProgressScope = Profile, XP and skills always stay: every player keeps them on their own PC.
# Setting type: Boolean
# Default value: true
ResetOnGameOver = true

## Where XP and unique and ultimate skills are kept. Profile: in each player's own profile on their PC, so they go with them to every lobby and save (as before 0.10.0). Save: in this save, for everyone in it: every player starts here with 0 XP and no skills, and what they earn here stays on this save; with ResetOnGameOver it is lost when the crew gets fired, like a fresh run. The players' own profiles are neither used nor changed on such a ship. SaveScopedSkills decides which skills belong to the save. A change applies when this PC next hosts a save; the lobby that is open keeps its current one. LethalRPG 0.9 and older leave a save played with Save untouched.
# Setting type: ProgressScope
# Default value: Profile
# Acceptable values: Profile, Save
ProgressScope = Profile

## ProgressScope = Save only: which skills belong to the save. Both: unique and ultimate skills. Unique: unique skills belong to the save, ultimate skills come from each player's profile. Ultimate: ultimate skills belong to the save, unique skills come from each player's profile. XP always belongs to the save; a skill that comes from a profile works on this ship but cannot be learned or reset here, and the profile is not changed. A change applies when this PC next hosts a save.
# Setting type: SaveScopedSkills
# Default value: Both
# Acceptable values: Both, Unique, Ultimate
SaveScopedSkills = Both

## Preset on top of all sliders below. Normal: the sliders as they are. Easy: prices x0.7, XP gains x1.5, upgrade effects x1.2. Hard: prices x1.4, XP gains x0.75, upgrade effects x0.9. Inventory slots and the tuning values of unique skills are not scaled.
# Setting type: Difficulty
# Default value: Normal
# Acceptable values: Normal, Easy, Hard
Difficulty = Normal

## Preset for how far upgrades go and how the unique skills are tuned (Difficulty changes prices, XP and effect strength instead). Standard: the sliders as they are. Generous: three times the MaxLevel of every upgrade (5 -> 15), but only as far as levels still do something: never above 20, reductions stop at their MaxReduction, Inventory at 20 slots, Crouch Walk at walking speed; Agility goes up to 10, Jump 6, Climber 7, Long Reach 8, and since 0.8.0 Vitality 8 (260 HP), Medic 8 (1.6 HP/s), Recovery 8 (+160%), Strength 7 (84% less weight penalty), Brawler 8 at half a point of damage per level (5 damage per hit; the half points add up over the hits on the same monster) and Inventory 8 (12 slots), so Generous is a longer progression, not a power fantasy (values with the default sliders on Normal). All these caps limit the effect: with Easy they stop where it would go above that (Vitality, Medic and Recovery at 6 levels, Agility 8, Jump 5, Long Reach 6; Strength, Brawler and Climber keep the 5, 3 and 5 levels of Standard, as Generous never ends below Standard). With half a point per level Concussive Blows and Coil Breaker ask for Brawler 4 and 6, on Normal the damage Brawler 2 and 3 have on Standard. Prices rise slower, so the last level costs what the old last level did. Lockpicking, hacking, shutting down a coil head and the Medic delay take half as long, Concussive Blows stuns longer and twice as often, Coil Breaker keeps a coil head down 50% longer and recharges twice as fast, Blast Shield damage is halved, Rallying Presence reaches 50% further and Second Wind has one more charge per day. Strict: 40% fewer levels (5 -> 3), lockpicking, hacking, shutting down a coil head and the Medic delay take 50% longer, Concussive Blows stuns shorter and less often, Coil Breaker keeps a coil head down 25% shorter and takes 50% longer to recharge, Blast Shield deals a third more damage, Rallying Presence reaches 25% less far. Skill requirements never ask for more than an upgrade's max level, and all values stay inside the slider ranges. Levels a save holds above a max level (e.g. bought on Generous before 0.8.0) are kept, but their effect stops at the max level until it is raised again; 'rpg refund' gives back RefundPercent of what was paid for them, as for any level.
# Setting type: Balancing
# Default value: Standard
# Acceptable values: Standard, Generous, Strict
Balancing = Standard

## Individual: every player buys and owns their money upgrades with a personal budget (ShareSplit decides how quota payouts are shared; FullShareEach gives everyone the whole share). Team: money upgrades are shared by the whole crew and paid from a team budget (quota payouts go there). Switching to Team keeps the highest level any player had of each upgrade and pools all budgets; budgets paid as full shares are copies of the same payouts and are not added up: the team budget is one share minus everything anyone bought with the shares (at least 0). On a moon the switch to Team waits until the ship is back in orbit. Switching back waits until the ship next lands, then gives every player the team's levels and splits the team budget evenly between the players aboard; with FullShareEach every player aboard gets all of it. Unique and ultimate skills and XP always stay personal. RulesPreset decides this unless it is Custom.
# Setting type: UpgradeOwnership
# Default value: Individual
# Acceptable values: Individual, Team
UpgradeOwnership = Individual

## What happens to LethalRPG's body and tool upgrades that another mod in the lobby has as well (LateGameUpgrades, e.g. Stamina and its Bigger Lungs). Stack: both work and their bonuses add up. PreferOtherMod: LethalRPG's upgrade is off for everyone while the same upgrade is on in the host's LateGameUpgrades config. Levels already bought are kept but do nothing until the host sets Stack again, 'rpg refund' gives them back as usual, and skills need no level in an upgrade that is off. Unique and ultimate skills always stay. RulesPreset LguCompanion sets this to PreferOtherMod.
# Setting type: OverlapPolicy
# Default value: Stack
# Acceptable values: Stack, PreferOtherMod
OverlapPolicy = Stack

