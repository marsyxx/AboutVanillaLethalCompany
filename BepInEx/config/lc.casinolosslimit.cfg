## Settings file was created by plugin CasinoLossLimit v1.0.0
## Plugin GUID: lc.casinolosslimit

[General]

## Switch the whole limit off without removing the mod.
# Setting type: Boolean
# Default value: true
Enabled = true

## The most scrap value one player can lose in the casino between two landings (losses minus winnings).
# Setting type: Int32
# Default value: 300
# Acceptable value range: From 1 to 100000
MaxNetLoss = 300

## Also refuse a bet whose scrap is worth more than the loss still allowed: the worst case of one game is the loss of the whole item, so the limit can never be exceeded. Off: the limit only stops further games once it has been reached.
# Setting type: Boolean
# Default value: true
StrictCap = true

## Start the count anew when the ship lands on a moon (the casino is on the Company moon, where the loot is sold). Off: the count lasts until the game is restarted.
# Setting type: Boolean
# Default value: true
ResetOnLanding = true

[Messages]

## Title of the message.
# Setting type: String
# Default value: Casino limit
Header = Casino limit

## Shown when the limit is reached. {0} = the limit.
# Setting type: String
# Default value: You have lost {0} here. No more gambling until the next landing.
LimitReached = You have lost {0} here. No more gambling until the next landing.

## Shown when StrictCap refuses a bet. {0} = the item's value, {1} = what is left of the limit.
# Setting type: String
# Default value: This item is worth {0}. You can still lose {1} before the next landing.
BetTooBig = This item is worth {0}. You can still lose {1} before the next landing.

