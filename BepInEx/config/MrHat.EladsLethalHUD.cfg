[Battery]

## If true, shows the battery usage when you aren't holding the item in use
# Setting type: Boolean
# Default value: false
Show Pocketed Item Battery = false

## If true, shows the percentage text on the battery
# Setting type: Boolean
# Default value: false
Show Battery Percentage = false

[Health]

## If true, hides the health display after the configured delay
# Setting type: Boolean
# Default value: true
Auto Hide Health = true

## Seconds before the health display fades out
# Setting type: Single
# Default value: 4
# Acceptable value range: From 0 to 30
Health Hide Delay = 4

## Opacity used after the health display automatically fades
# Setting type: Single
# Default value: 0
# Acceptable value range: From 0 to 1
Auto Fade Opacity = 0

[HUD]

## Sets the size of the HUD
# Setting type: Single
# Default value: 0.75
# Acceptable value range: From 0,1 to 2
HUD Scale = 0.75

## If true, applies custom changes to the voice activity icon
# Setting type: Boolean
# Default value: true
Affect Voice Activity Icon = true

## If true, replaces the vanilla voice activity icon with a custom icon
# Setting type: Boolean
# Default value: true
Replace Voice Activity Icon = true

[Oxygen]

## If true, fades the oxygen display when oxygen is not low enough to keep it visible
# Setting type: Boolean
# Default value: true
Auto Hide Oxygen = true

## Seconds before the oxygen display fades out
# Setting type: Single
# Default value: 4
# Acceptable value range: From 0 to 30
Oxygen Hide Delay = 4

## Opacity used after the oxygen display automatically fades
# Setting type: Single
# Default value: 0
# Acceptable value range: From 0 to 1
Auto Fade Opacity = 0

## If true, uses the configured percentage as the reveal threshold
# Setting type: Boolean
# Default value: false
Use Minimum Percentage Until Popup = false

## Show the oxygen display when oxygen reaches this percentage or lower
# Setting type: Single
# Default value: 70
# Acceptable value range: From 0 to 100
Minimum Percentage Until Popup = 70

## If true, disables the oxygen display
# Setting type: Boolean
# Default value: false
Disable Oxygen Display = false

