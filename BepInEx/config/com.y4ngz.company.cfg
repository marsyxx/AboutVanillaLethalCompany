[Diagnostics]

## Watches the local player's input flags and reports only when one stays set long enough to mean the player has genuinely lost interact, movement or look control. Costs ten field reads per frame while nothing is wrong. Replaces an older watchdog key that was never bound and so never had any effect.
# Setting type: Boolean
# Default value: true
Local Input State Watchdog Enabled = true

## When true, logs every rejected interior placement candidate. Leave false during normal play; failed plans still log compact reject summaries.
# Setting type: Boolean
# Default value: false
Detailed Placement Reject Logging = false

## Mitigation for slower clients hard-hanging inside DunGen on oversized interiors (y4ngz313/Y4NGZCompany#446: a 125-tile Alcatras Bunker at DungeonSize 2.4 wedged both clients mid-generation while the host waited forever on floor-generation acks). 0 disables the cap and leaves the scalar exactly as the game and LethalLevelLoader set it - that value is NOT chosen by this mod. When set above 0, the effective DungeonSize (DunGen's LengthMultiplier) is clamped to this value immediately before generation starts, on whichever peer is generating, and the clamp is logged loudly. Around 1.8 is a reasonable starting ceiling; lower it further only if clients still stall.
# Setting type: Single
# Default value: 0
# Acceptable value range: From 0 to 5
Dungeon Size Soft Cap = 0

## Enables rate-limited Shadow Raid and Blacksite Retrieval UAT diagnostics.
# Setting type: Boolean
# Default value: false
Shadow Raid Debug Logging = false

## Blacksite [UAT] producers skip building their lines (each is still counted for the [UAT][Cost] census); any remaining line is dropped at the log sink. The [UAT][Cost] line still prints. For log I/O A/B. Needs Shadow Raid Debug Logging on.
# Setting type: Boolean
# Default value: false
Blacksite UAT Output Muted = false

## When off, Blacksite soldier helmet lights cast no shadows. Performance A/B.
# Setting type: Boolean
# Default value: true
Blacksite Helmet Light Shadows = true

## When off, every soldier runs full-rate animator, aim pose, helmet light and equipment presentation on this client regardless of distance. Performance A/B.
# Setting type: Boolean
# Default value: true
Blacksite Soldier Presentation LOD = true

## Host only. Milliseconds a frame the Blacksite landing search may spend while you are inside the ship. Every frame runs one search step; a further step runs only if its last measured cost fits in what is left. Lower is smoother but the raid arrives later.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0,1 to 8
Blacksite Landing Search Slice Milliseconds = 1

## Host only. The same budget while you are outside the ship; never more than the inside value.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0,1 to 8
Blacksite Landing Search Outside Slice Milliseconds = 1

## Host only. Seconds the Blacksite landing search may run. At the bound a hover search keeps the obstructed rappel foot it has found; a search with no landing yet skips the raid.
# Setting type: Single
# Default value: 90
# Acceptable value range: From 10 to 600
Blacksite Landing Search Max Seconds = 90

## Developer profiling switch for the per-frame timing reports. Off, a runtime pass only reports once it costs more than a whole frame at 60 fps, and it reports at Info; the one-time Harmony patch census drops to Debug. On, the investigation thresholds and Warning levels come back, so a pass over 5ms is reported loudly. The once-per-round landing and HUD-reveal timing lines are unaffected either way.
# Setting type: Boolean
# Default value: false
Performance Timing Logging = false

## Developer layout aid. On, Ctrl+Alt+F11 steps the performance report through a sample with six bottom-row cells, then five, then closed, in orbit or on a moon, and Y4NGZDebugTools can open it too. The sample never reaches XP, tokens or the save, and it will not open over a real round-end report. Local only; leave off for normal play.
# Setting type: Boolean
# Default value: false
Performance Report Preview = false

## Seconds of high-rate gait and motion detail per soldier after a failure transition (a stall or a refused motion request). 0 disables all high-rate detail: no [UAT][Gait] lines, no [UAT][Motion] heartbeat, no [UAT][MotionRequest] repeats. Transition lines are always emitted. A window that keeps re-opening is capped at three times this value.
# Setting type: Single
# Default value: 8
# Acceptable value range: From 0 to 60
Blacksite Detail Capture Seconds = 8

## When set above 0, opens a capture window on the next landing (or immediately) that records every call to EnemyAI.PathIsIntersectedByLineOfSight, grouped by enemy type and calling mod path, then prints a ranked summary. Costs frame time while the window is open; leave at 0 for zero overhead.
# Setting type: Single
# Default value: 0
# Acceptable value range: From 0 to 60
Path LOS Caller Capture Seconds = 0

