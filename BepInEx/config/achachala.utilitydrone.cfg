## Drone camera sensitivity.
# Setting type: Single
# Default value: 0.12
# Acceptable value range: From 0,02 to 0,5
MouseSensitivity = 0.12

## 0 = left, 1 = right, 2 = middle.
# Setting type: Int32
# Default value: 0
# Acceptable value range: From 0 to 2
UseMouseButton = 0

## Scan: 0 = left, 1 = right, 2 = middle. If this matches the module button, scan uses middle mouse (or right if the module uses middle).
# Setting type: Int32
# Default value: 1
# Acceptable value range: From 0 to 2
ScanMouseButton = 1

[Defibrillator]

## Host: how many revives the defibrillator allows on each moon, shared by every drone. 0 means no limit.
# Setting type: Int32
# Default value: 0
# Acceptable value range: From 0 to 10
RevivesPerMoon = 0

## Host: battery points one revive costs, from 25 to 100.
# Setting type: Int32
# Default value: 25
# Acceptable value range: From 25 to 100
BatteryCost = 25

[Display]

## Strength of the drone camera's monitor static and scanlines. 0 turns it off, 1 is light and 2 is twice as strong as 1.
# Setting type: Single
# Default value: 1.5
# Acceptable value range: From 0 to 2
ScreenEffect = 1.5

## Look of the drone's HUD, for you only. Stylized is the drone OS look in the game's terminal font; Simplistic is the cleaner, simpler look in plain white text.
# Setting type: HudStyle
# Default value: Stylized
# Acceptable values: Stylized, Simplistic
HudStyle = Stylized

## Size of the drone's HUD, for you only. 1 is normal, 0.5 is half size and 2 is double.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0,5 to 2
HudScale = 1

[Enemies]

## Host: loot bugs take a drone flying low (within 2 m of the floor) for loot, carry it to their nest and drop it there. Hitting, stunning or zapping the bug frees the drone.
# Setting type: Boolean
# Default value: true
LootBugsGrabDrone = true

## Host: a drone flying into a hygrodere takes 35 damage every 0,25 s, as a player standing in one does. Needs Health on.
# Setting type: Boolean
# Default value: true
HygroderesHurtDrone = true

## Host: a butler that finds a drone alone, with no player near it, attacks it with its knife, as it does a lone player. Needs Health on.
# Setting type: Boolean
# Default value: true
ButlersHuntDrone = true

## Host: a giant sapsucker attacks a drone carrying one of its eggs in its cargo. Needs Health on.
# Setting type: Boolean
# Default value: true
SapsuckersDefendEggs = true

## Host: an eyeless dog the drone hurts (zap gun, stun grenade, shotgun), or one raging within earshot of its boombox, runs the drone down, shakes it in its jaws and throws it for 50 damage (with Health on). Stunning or hitting the dog makes it drop the drone.
# Setting type: Boolean
# Default value: true
EyelessDogsAttackDrone = true

## Host: tulip snakes leap onto a drone flying low. One makes it hard to fly; two or more carry it off until they let go.
# Setting type: Boolean
# Default value: true
TulipSnakesGrabDrone = true

[Health]

## Host: gives the drone health, on by default. At 0 it is wrecked and limps home at half speed. Off, the drone takes no damage and no health is shown.
# Setting type: Boolean
# Default value: true
Enabled = true

## Host: multiplies all damage the drone takes. 1 is normal, 2 is double, 0.5 is half.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0,1 to 5
DamageMultiplier = 1

## Host: health the charging station's welding arms restore to a docked drone each second. 2 is normal.
# Setting type: Single
# Default value: 2
# Acceptable value range: From 1 to 25
RepairRate = 2

[Interface]

## Client: how much of your screen the drone management window fills, in percent (40 to 100). 75 is the default. Changes show the next time the window draws.
# Setting type: Int32
# Default value: 75
# Acceptable value range: From 40 to 100
ManagementWindowSize = 75

[Magnet]

## Host: how fast the drone flies while the magnet is holding a player or cruiser (a dead body slows it by 25% at most). The higher it is, the slower the drone moves. If you want to zoom around full speed while carrying a massive truck set it to 0. Don't set it to 100 unless you want to not move...
# Setting type: Int32
# Default value: 50
# Acceptable value range: From 0 to 100
CarrySpeedPercent = 50

