## Settings file was created by plugin Utility Drone v0.8.0
## Plugin GUID: achachala.utilitydrone

[Battery]

## Host: how fast the drone recharges on its station. 1 is normal, 2 charges twice as fast and 0.5 half as fast (0,1 to 10).
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0,1 to 10
RechargeSpeed = 1

[Battery Costs]

## Host: battery points per second while the zap gun is zapping.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0 to 100
ZapGunPerSecond = 1

## Host: battery points for each door the lockpicker unlocks.
# Setting type: Single
# Default value: 5
# Acceptable value range: From 0 to 100
LockpickerPerDoor = 5

## Host: battery points per second while spraying paint.
# Setting type: Single
# Default value: 0.25
# Acceptable value range: From 0 to 100
SprayPaintPerSecond = 0.25

## Host: battery points for each shotgun shot.
# Setting type: Single
# Default value: 5
# Acceptable value range: From 0 to 100
ShotgunPerShot = 5

## Host: battery points per second while the healing beam heals.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0 to 100
HealingBeamPerSecond = 1

## Host: battery points per second while the magnet carries an employee.
# Setting type: Single
# Default value: 1.5
# Acceptable value range: From 0 to 100
MagnetEmployeePerSecond = 1.5

## Host: battery points per second while the magnet carries the cruiser.
# Setting type: Single
# Default value: 3
# Acceptable value range: From 0 to 100
MagnetCruiserPerSecond = 3

## Host: battery points for each trap the trap hacker destroys.
# Setting type: Single
# Default value: 5
# Acceptable value range: From 0 to 100
TrapHackerPerHack = 5

## Host: battery points per second while the boombox plays.
# Setting type: Single
# Default value: 0.1
# Acceptable value range: From 0 to 100
BoomboxPerSecond = 0.1

## Host: battery points for each piece of equipment the battery charger recharges.
# Setting type: Single
# Default value: 20
# Acceptable value range: From 0 to 100
BatteryChargerPerRecharge = 20

## Host: battery points for each stun grenade fired.
# Setting type: Single
# Default value: 5
# Acceptable value range: From 0 to 100
StunLauncherPerGrenade = 5

## Host: battery points for each grapple winch pull.
# Setting type: Single
# Default value: 2
# Acceptable value range: From 0 to 100
GrappleWinchPerPull = 2

## Host: battery points per second while the grapple winch reels something in.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0 to 100
GrappleWinchReelPerSecond = 1

## Host: how fast flying drains the battery. 1 is normal, 0 makes flight free and 5 drains five times as fast. Zapping and module costs are separate.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0 to 5
FlightCost = 1

[Beacon]

## Multiplies the beacon module's light: 1 is normal, 2 is twice as bright. It always reaches 35 meters.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0,25 to 4
BrightnessMultiplier = 1

[Cargo]

## Host: the most the drone can carry in pounds (between 5 and 200). Each pound up to 50 slows the drone down by 1%, maxing at 50%. You can increase this beyond 50 but I wouldn't recommend it if you care about balance. You cannot change it to anything above 200 without it reverting, not that you would realistically get much out of it. Otherwise, have at it. I'm not your mom.
# Setting type: Int32
# Default value: 50
# Acceptable value range: From 5 to 200
MaxCargoWeight = 50

