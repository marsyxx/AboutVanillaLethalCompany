## Settings file was created by plugin MemoryJanitor v1.3.0
## Plugin GUID: lcmemfix.MemoryJanitor

[Audio]

## When the ship is back in orbit, free the decompressed sample data of Decompress-On-Load clips that are not playing. Unity reloads a clip the next time it is played.
# Setting type: Boolean
# Default value: true
UnloadIdleDecompressedAudio = true

## Only unload clips at least this long. Short clips cost little and reloading them often is wasteful.
# Setting type: Single
# Default value: 3
MinClipSeconds = 3

## Also unload clips marked 'Preload Audio Data'. Frees more, but those clips may stutter once when first replayed.
# Setting type: Boolean
# Default value: false
IncludePreloadedClips = false

## Also free idle Decompress-On-Load clips every this many seconds, not just in orbit. 0 = orbit only. Only the cheap audio pass runs this often; the full unused-asset unload freezes the game for a moment, so it stays in orbit.
# Setting type: Single
# Default value: 30
SweepSeconds = 30

## In the periodic sweep, only free clips that haven't been heard playing for this long, so sounds in use don't reload.
# Setting type: Single
# Default value: 2
IdleMinutes = 2

[Diagnostics]

## Write a memory breakdown to the log at the main menu, after each orbit cleanup and 40 s after each landing.
# Setting type: Boolean
# Default value: false
MemoryReports = false

[General]

## Run Resources.UnloadUnusedAssets and a GC after the audio pass, to drop anything left behind by the last moon.
# Setting type: Boolean
# Default value: true
UnloadUnusedAssets = true

## Seconds to wait after reaching orbit before cleaning, so the moon scene has finished unloading.
# Setting type: Single
# Default value: 4
DelaySeconds = 4

[Textures]

## Skip this many of the largest mip levels on every mipmapped texture. Lethal Company renders the world at 620x364, so 1 (half resolution, about 75% less texture memory) looks the same; 2 saves more. 0 = off.
# Setting type: Int32
# Default value: 1
# Acceptable value range: From 0 to 3
MipmapLimit = 0

