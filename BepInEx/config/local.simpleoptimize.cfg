## Settings file was created by plugin SimpleOptimize v0.1.17
## Plugin GUID: local.simpleoptimize

[Audio]

## Raise how many sounds Unity plays at once on your machine (the game's limit is low, so in busy moments footsteps, doors and enemies drop out). Applied once at startup, before the menu. Your machine only.
# Setting type: Boolean
# Default value: true
RaiseVoiceLimit = true

## Sounds actually played at the same time (32-255). Only ever raised, never lowered.
# Setting type: Int32
# Default value: 128
RealVoices = 128

## Sounds tracked at once (the quietest beyond RealVoices are silenced but kept in time), at least RealVoices, up to 4095. Only ever raised.
# Setting type: Int32
# Default value: 512
VirtualVoices = 512

[Dropship]

## Speed up the CARGO dropship that delivers items bought at the terminal. Vanilla makes you wait 40s for it to arrive and 30s before it leaves. Host-authoritative, so only the host needs this — vanilla clients see the early arrival with no desync. Toggle: /opt dropship on|off.
# Setting type: Boolean
# Default value: true
FastDropship = true

## Speed level 1-4 for the dropship's countdown and landing animation. Set in-game with /opt dropship speed <#>. 1 = vanilla (40s arrive, 30s parked), 2 = 20s/15s, 3 = 13s/10s, 4 = 10s/8s.
# Setting type: Single
# Default value: 4
Speed = 4

## Hold the landed dropship until someone opens it, instead of leaving on vanilla's 30s timer. Vanilla takes your items AND your credits if it leaves unopened ("Items missed! ... delivery fee cannot be refunded"), and speeding the countdown up made that window too short to reach. Once opened, Speed applies and it leaves quickly. Toggle: /opt dropship wait on|off.
# Setting type: Boolean
# Default value: true
WaitForOpen = true

[Fixes]

## Fix the vanilla bug where a spider web broken/removed while you're in it leaves you permanently slowed (RemoveWeb uses the wrong cleanup factor and double-cleans via OnDestroy). Also self-heals already-corrupted hindered state.
# Setting type: Boolean
# Default value: true
FixSpiderWebSlow = true

## Fix the vanilla 'interact glitch' (can't interact or scroll-swap until relog): the throwingObject flag is only reset by a server RPC round trip; if that's lost it sticks forever. Watchdog clears it after 2s.
# Setting type: Boolean
# Default value: true
FixStuckInteract = true

## Stop the cruiser being launched by physics depenetration when a player capsule ends up inside it (door-exit teleports, TZP-drunk movement). Overlapping players briefly ghost through the truck instead — vanilla's own seated-player collision toggle.
# Setting type: Boolean
# Default value: true
FixCruiserYeet = true

## Mute the vanilla 'ThrowObjectClientRpc called for an object...' error spam from desynced client drops (thousands of log lines per session = real frame cost; vanilla already ignores the bad request).
# Setting type: Boolean
# Default value: true
MuteThrowRpcSpam = true

## Fix the FPS collapse when killing Cadaver growth plants: vanilla throws an exception per kill (logged twice with stack traces) plus ~5 debug log lines per kill. Swallows the exceptions and mutes exactly those log lines.
# Setting type: Boolean
# Default value: true
FixCadaverKillLag = true

## Stop the weed killer throwing an exception EVERY FRAME after the plant or mold it was killing gets destroyed (stale cached index in SprayPaintItem.LateUpdate). Measured at 25,691 exceptions with stack traces in one session. Clears the stale target so it fails once instead of thousands of times.
# Setting type: Boolean
# Default value: true
FixWeedKillerIndexSpam = true

## Make the terminal 'scan' command exact: vanilla adds a random guess per item instead of its real value after landing, and before the doors open it counts the whole moon's scrap as 'in the ship'. Counts real values of scrap not in the ship (on the moon), or in the ship while in orbit. Your terminal only, no network messages.
# Setting type: Boolean
# Default value: true
FixExactScan = true

## Show real names instead of 'unknown' for players who joined late. The game looks names up through Steam, which only knows friends and people in the same Steam lobby, and everyone leaves that lobby when the ship first lands. This asks Steam for the missing names directly, and takes the names a SimpleOptimize host sends ([Names] HostNameSync). Only fixes what YOUR screen shows.
# Setting type: Boolean
# Default value: true
FixUnknownNames = true

## Stop the 'Particle System is trying to spawn on a mesh with zero surface area' flood. A dead body's blood effect can be pointed at a mesh with no surface, and the game then warns every single frame: 57,398 lines in one measured session, which costs real frames. Switches off just that emitter, which could never have drawn anything.
# Setting type: Boolean
# Default value: true
FixZeroAreaParticleSpam = true

## Mute the Debug.Log flood inside VehicleController.CollectItemsInTruck. Vanilla logs THREE lines per collider inside its 25m sweep, so a few hundred items aboard is ~700 formatted log writes per magnet event — measured at 772ms with 237 items, and it is the whole cost of StartMagneting. Only that method's own logging is dropped.
# Setting type: Boolean
# Default value: true
MuteTruckCollectSpam = true

## When someone joins, the host sends them the value of every item on the map, but vanilla stops after the first ~500 items (nearest the map centre first, scrap and gear alike), so on a big hoard the rest show $0 for the joiner. This lifts that cap. Host-side only; vanilla joiners get the right values too.
# Setting type: Boolean
# Default value: true
FixJoinScrapValues = true

## Upper limit for FixJoinScrapValues (500-20000). The values go in ONE vanilla message (it can't be split: vanilla joiners read it in one go), about 8 bytes per item, so 4000 items is ~32 KB. Raise it only if you really have more items than this.
# Setting type: Int32
# Default value: 4000
JoinSyncMaxItems = 4000

## When a player disconnects or is kicked while sitting in the cruiser (driver or passenger), vanilla keeps their seat taken forever: nobody can drive or sit there until the lobby is restarted. This frees the seat on your own machine when the disconnect happens. No network messages; the host also takes the truck back if the leaver was driving. Works best when everyone has it (each machine frees its own copy of the seat).
# Setting type: Boolean
# Default value: true
FixCruiserSeatDisconnect = true

## Vanilla bug: when someone joins into a slot a kicked or disconnected player had, the game can keep that slot tied to the old player's voice, so once you are dead you can't hear the new player (alive you hear them normally). This re-checks every player's voice link a few seconds after a join, after a disconnect, when you die or switch spectate (and every few seconds while dead), and re-links any wrong one with the game's own voice refresh. Your machine only, no network messages; does nothing when every link is right. Logged as [Voice].
# Setting type: Boolean
# Default value: true
FixLateJoinVoice = true

## Vanilla bug: the dead players' boxes (left side while spectating) are made once per player slot, so a player who joined into someone else's old slot shows the previous player's Steam picture. This redraws the picture and name when the slot's player changed. Your screen only. Logged as [Avatars].
# Setting type: Boolean
# Default value: true
FixSpectatorAvatars = true

[General]

## Prefix for chat commands (e.g. /opt).
# Setting type: String
# Default value: /
CommandPrefix = /

## Second prefix that always works, e.g. !opt. Other chat-command mods (ChatCommandAPI and similar) often claim every '/' message and reply 'unknown command' before SimpleOptimize ever sees it. They ignore '!', so this gets through. Empty to disable.
# Setting type: String
# Default value: !
AltCommandPrefix = !

[Names]

## Host: fix late joiners seeing 'unknown' for everyone but the host. Names never travel over the network: each game asks its own Steam, and Steam only names friends and people in the same Steam lobby, which after the first landing holds only the host. A few seconds after each join (2, 8 and 20 s) the host sends its own names to players running SimpleOptimize, who apply them at once. Players without SimpleOptimize keep the names their own Steam knows (see ResendSteamIds).
# Setting type: Boolean
# Default value: true
HostNameSync = true

## Host, part of HostNameSync: on each of those passes also re-send the game's own 'player Steam IDs' message (the one vanilla sends on every join), so every player, modded or not, looks the names up again once their Steam has caught up. Only helps vanilla players with names their Steam can know (friends, people in the same Steam lobby).
# Setting type: Boolean
# Default value: true
ResendSteamIds = true

[Optimizer]

## Skip per-frame Update() for items resting on the ship (not held, settled). They wake instantly when grabbed or moved. Toggle in-game: /opt sleep on|off.
# Setting type: Boolean
# Default value: true
SleepShipItems = true

## Turn off shadow casting for items resting on the ship (restored when picked up or off the ship). Toggle in-game: /opt shadows on|off.
# Setting type: Boolean
# Default value: true
DisableShipItemShadows = true

## Vanilla only SAVES the first 250 ship items (StartOfRound.maxShipItemCapacity) — the rest silently despawn on the next load. This raises the cap (0 = leave vanilla). Matters on the host, who writes the save.
# Setting type: Int32
# Default value: 9999
ShipItemCapacity = 9999

## Skip the fall animation for items dropped/moved aboard the ship or cruiser — they settle instantly and start sleeping the same frame (falling items can't sleep). Items dropped outside still fall normally. Toggle: /opt snap on|off.
# Setting type: Boolean
# Default value: true
SnapAboardItems = true

## Stop rendering aboard items entirely while you're far from them (draw calls are the big hoard cost while farming away from the ship); restored as you approach. Toggle: /opt cull on|off.
# Setting type: Boolean
# Default value: true
CullDistantShipItems = true

## Distance (meters) beyond which aboard items stop rendering.
# Setting type: Single
# Default value: 45
CullDistance = 45

[Radar]

## Fix the ship monitor showing one player's name while it is really following someone else (so the teleporter beams the wrong person). Vanilla bug, happens in any lobby: turning on a radar booster re-sorts the monitor's list, and the next time anyone joins the game writes names by player slot number into the re-sorted list. Names are put back on the right players; two players with the same name show as Name and Name2. Fixes your own screen; other players need SimpleOptimize 0.1.14 too.
# Setting type: Boolean
# Default value: true
FixRadarNames = true

## Host: send the monitor's player/booster order to players who also run SimpleOptimize, so pressing 'switch' shows the same person on everyone's monitor. Players without it are unaffected. As a player: follow the host's order when it is sent.
# Setting type: Boolean
# Default value: true
SyncRadarOrder = true

[Spray]

## off | palette | custom. Vanilla rolls a spray can's colour from the map seed, so overriding it is LOCAL to your screen — vanilla friends still see the seeded colour for the same can and the same decals (nothing desyncs). Set with /opt spray.
# Setting type: String
# Default value: off
ColorMode = off

## Which of the game's own spray materials to use in palette mode (and which slot custom mode tints). Range depends on the prefab — /opt spray reports how many exist.
# Setting type: Int32
# Default value: 0
ColorIndex = 0

## Colour for custom mode, e.g. #FF00FF. The decals are HDRP DecalProjector materials, so the shader's colour property varies; every known name is tried and /opt spray reports which one took.
# Setting type: String
# Default value: #FF00FF
ColorHex = #FF00FF

## As a client, adopt the host's spray colour so the lobby matches. Set false to keep your own. Has no effect when you ARE the host. Players without SimpleOptimize always see the vanilla seeded colour — the colour never travels in vanilla netcode.
# Setting type: Boolean
# Default value: true
AcceptHostColor = true

[Transit]

## Speed up the PLAYER SHIP's landing and takeoff. OFF by default (Round 12) — Josh wanted the cargo dropship, not this; see [Dropship] FastDropship. ONLY engages when every player in the lobby is running SimpleOptimize (or you're solo) — the sequences are local on each machine, so a lone fast client would get control before everyone else. Toggle: /opt transit on|off.
# Setting type: Boolean
# Default value: false
FastCompanyTransit = false

## Restrict the speed-up to Gordion (The Company). Other moons keep vanilla pacing so normal runs feel untouched.
# Setting type: Boolean
# Default value: true
CompanyOnly = true

## Divisor for transit waits and matching animator speed. 3 turns the ~21s landing into ~7s. Higher values risk audio/animation popping, since some sounds run on their own timers.
# Setting type: Single
# Default value: 3
Speed = 3

