## Settings file was created by plugin LCCompatFixes v1.0.7
## Plugin GUID: lc.compatfixes

[Fixes]

## Gives HUDManager.loadingDarkenScreen (removed by a game update, still used by LethalCasino) a harmless stub Image. Needs the companion patcher.
# Setting type: Boolean
# Default value: true
StubLoadingDarkenScreen = true

## loaforcsSoundAPI 2.x rejects sound packs whose name contains '.', which silently disables the RTLC Russian sound packs. Replaces '.' with '_' in pack names.
# Setting type: Boolean
# Default value: true
SoundApiPackNameDots = true

## EladsHUD+ loads its HUD from an embedded asset bundle with AssetBundle.LoadFromStream. With BepInEx_Faster_Load_AssetBundles_Patcher and XUnity both hooking that call, Unity loads the bundle but the caller is handed null, and the mod crashes in Awake. When that happens, hand the caller the bundle that was just loaded.
# Setting type: Boolean
# Default value: true
StreamBundleResult = true

## The RTLC Russian translation goes through every texture in memory on each level load, all in one frame: a 1-2 second freeze when the ship lands (a pause of its own on a modded game). When on, the same pass is done a few milliseconds per frame instead, so the game keeps running smoothly; the Russian textures appear a moment later.
# Setting type: Boolean
# Default value: true
RtlcSceneLoadSlicing = true

## RTLC replaces each translated texture by encoding the replacement to PNG and decoding it again on the main thread: 40 ms for a 1024x1024 texture, 200-300 ms for 2048x2048, about 2 seconds of stalls when the ship lands on a moon. For plain uncompressed textures the pixels are copied directly instead (same result, about 1 ms); anything else is left to RTLC.
# Setting type: Boolean
# Default value: true
RtlcFastTextureCopy = true

## RTLC also replaces the game's own compressed textures (posters, signs, some HUD pictures) by recompressing them: 40-480 ms each, about 4 seconds in total on the first lobby of a session. When on, those textures are left as they are (in English) and the freeze is gone. Off = everything is translated, as before.
# Setting type: Boolean
# Default value: false
RtlcSkipCompressedTextures = false

## TextMeshPro logs 'The character used for Underline is not available in font asset' for every underlined text in a font without the underscore glyph: about 900 lines per session, each a Unity log call with a stack trace. The text looks the same; when on, only that message is dropped.
# Setting type: Boolean
# Default value: true
QuietTmpUnderline = true

## Mods that look types up by name (AccessTools.TypeByName / AllTypes) make HarmonyX call Assembly.GetTypes on every loaded assembly each time. For the few assemblies that cannot load fully (they reference mods that are not installed) that call throws and takes 1-2 seconds, and it was repeated over a hundred times per session. The result of each scan is remembered, so it runs once per assembly.
# Setting type: Boolean
# Default value: true
CacheTypeScans = true

## HarmonyX's AccessTools.TypeByName (also behind AccessTools.Method("Type:Method") and similar) compares the full name of every type in every loaded assembly, twice, on each call, and builds a new string for each one. A lookup of a mod that is not installed takes 2-6 seconds, and mods such as LazyLobby, LazyLanding and WeatherRegistry do dozens of them at startup and in the main menu; this was the biggest single cause of the long start and of the freezes of ten seconds and more in the menu. When on, names are looked up with the runtime's own per-assembly lookup and the answers are remembered; the result is the same type as before, a miss is answered at once, and the 'Could not find type named' warning for misses is no longer printed.
# Setting type: Boolean
# Default value: true
FastTypeByName = true

## LethalRPG's Strength skill finds the carry-weight reads in PlayerControllerB.Update/LateUpdate and scales them, but BetterStamina's patch (which runs first because of its priority) has already replaced those reads, so LethalRPG logs 'no reads of carryWeight found' and Strength does nothing. This puts LethalRPG's two carry-weight patches ahead of BetterStamina's, so both see the code they expect. Only the order changes; neither mod's code is touched.
# Setting type: Boolean
# Default value: true
LethalRpgStrengthBeforeBetterStamina = true

## Key that forces a stuck TooManyEmotes animation to end and gives the controls back (a name from Unity's Key list, for example Backspace, End, F8). Does nothing unless an emote is running, or while typing in the terminal or chat.
# Setting type: String
# Default value: Backspace
EmoteEscapeKey = Backspace

## The terminal matches a typed word to any keyword that begins with it, so 'the' matched the monster file 'thewail' (from a monster mod) and 'the company' showed that file instead of the Company. When on, the word 'the' is ignored by the terminal.
# Setting type: Boolean
# Default value: true
TerminalIgnoreThe = true

## Catches two errors that cancelled jumping for a client: BetterEXP's jump statistics throwing KeyNotFoundException (the jump is no longer cancelled) and TextMeshPro's font asset throwing NullReferenceException thousands of times (treated as a missing glyph).
# Setting type: Boolean
# Default value: true
ModGuards = true

ShotgunHitBuffer = true

[Intro]

## Video played full screen with sound when the game starts (the main menu loads underneath). Space or Esc skips it. A file name next to LCCompatFixes.dll, or a full path. Leave empty to turn the intro off.
# Setting type: String
# Default value: intro.mp4
VideoFile = intro.mp4

## A window that shows which mod is loading and how far the start has got (LCLoading.exe, started by the patcher before the game loads). It goes away by itself as soon as the Online / LAN screen or the main menu is reached, and never takes the keyboard from the game. Takes effect on the next start.
# Setting type: Boolean
# Default value: true
LoadingWindow = true

[PerfReport]

## Records frame times and memory into BepInEx/perf-report.csv (one row per second) and BepInEx/perf-summary.txt (per place: menu, orbit, moon, dungeon, ship), so one small file shows where the game stutters. Local only: nothing is sent, no player name, Steam id or folder path is written. Costs well under 0.1 ms per frame.
# Setting type: Boolean
# Default value: true
Enabled = true

[Tools]

## Test mode for RtlcFastTextureCopy: for the first 40 textures, also does RTLC's PNG round trip on a scratch texture and logs whether the pixels are identical.
# Setting type: Boolean
# Default value: false
RtlcFastCopyValidate = false

## Translation helper: writes the texts that are still English on screen to BepInEx/untranslated.txt (each once, with the object path). For the person who translates the pack; leave off while playing.
# Setting type: Boolean
# Default value: false
LogUntranslated = false

